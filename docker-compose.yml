version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/auth_db
      - JWT_SECRET=MySuperSecretKeyForJWTAuthServiceSigningKey1234567890!
    depends_on:
      - mongodb

  movie-service:
    build: ./movie-service
    container_name: movie-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/movie_db
    depends_on:
      - mongodb

  booking-service:
    build: ./booking-service
    container_name: booking-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/booking_db
    depends_on:
      - mongodb

  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/notification_db
    depends_on:
      - mongodb

  payment-service:
    build: ./payment-service
    container_name: payment-service
    ports:
      - "8085:8085"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/payment_db
    depends_on:
      - mongodb

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8081
      - MOVIE_SERVICE_URL=http://movie-service:8082
      - BOOKING_SERVICE_URL=http://booking-service:8083
      - NOTIFICATION_SERVICE_URL=http://notification-service:8084
      - PAYMENT_SERVICE_URL=http://payment-service:8085
      - CLIENT_SECRET_KEY=CinemaClientSecret2026!
      - API_KEY_SECRET=SecretApiKey12345
    depends_on:
      - auth-service
      - movie-service
      - booking-service
      - notification-service
      - payment-service

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway

volumes:
  mongo_data:
