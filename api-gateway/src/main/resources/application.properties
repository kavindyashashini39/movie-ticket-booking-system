server.port=8080
spring.application.name=api-gateway

# Target Microservice URLs (configurable for local host or Docker container names)
auth.service.url=${AUTH_SERVICE_URL:http://localhost:8081}
movie.service.url=${MOVIE_SERVICE_URL:http://localhost:8082}
booking.service.url=${BOOKING_SERVICE_URL:http://localhost:8083}
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8084}
payment.service.url=${PAYMENT_SERVICE_URL:http://localhost:8085}

# Client to Gateway Secret Key (required header from Client: X-Client-Secret)
client.secret.key=${CLIENT_SECRET_KEY:CinemaClientSecret2026!}

# Internal API Key injected by Gateway when communicating with microservices
api.key.secret=SecretApiKey12345

# SpringDoc / Swagger UI Multi-Service Aggregation Config
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.urls[0].name=1. Central API Gateway
springdoc.swagger-ui.urls[0].url=/v3/api-docs
springdoc.swagger-ui.urls[1].name=2. Auth Service (Port 8081)
springdoc.swagger-ui.urls[1].url=/api-docs/auth
springdoc.swagger-ui.urls[2].name=3. Movie Service (Port 8082)
springdoc.swagger-ui.urls[2].url=/api-docs/movies
springdoc.swagger-ui.urls[3].name=4. Booking Service (Port 8083)
springdoc.swagger-ui.urls[3].url=/api-docs/bookings
springdoc.swagger-ui.urls[4].name=5. Notification Service (Port 8084)
springdoc.swagger-ui.urls[4].url=/api-docs/notifications
springdoc.swagger-ui.urls[5].name=6. Payment Service (Port 8085)
springdoc.swagger-ui.urls[5].url=/api-docs/payments
